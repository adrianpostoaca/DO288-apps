apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-server
  labels:
    app.kubernetes.io/part-of: node-server-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-server
  template:
    metadata:
      labels:
        app: node-server
    spec:
      containers:
        - name: node-server
          image: node-server:latest  # OpenShift will automatically resolve this to your local image build
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: node-server
  labels:
    app.kubernetes.io/part-of: node-server-app
spec:
  selector:
    app: node-server
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: node-server
  labels:
    app.kubernetes.io/part-of: node-server-app
spec:
  port:
    targetPort: 4000
  to:
    kind: Service
    name: node-server

